name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rust parser and sandbox
        run: cargo test --manifest-path native/Cargo.toml
      - name: Python package
        run: pip install -e ".[dev]"
      - name: Unit and acceptance tests
        run: pytest
      - name: Dashboard
        run: npm --prefix dashboard ci && npm --prefix dashboard run build
      - name: CI policy blocks a malicious pickle and allows a clean template
        run: |
          python -c "from pathlib import Path; from modelsentinel.fixtureslib import write_fixtures; write_fixtures(Path('fixtures'))"
          if python -m modelsentinel scan fixtures/malicious/payload.bin --ci; then
            echo "malicious pickle was not blocked"
            exit 1
          fi
          python -m modelsentinel scan fixtures/gguf/clean_template.gguf --ci

  sandbox-cross-platform:
    # The sandbox binary must build and behave on every OS. Kernel isolation
    # (seccomp/Landlock) is asserted by the ubuntu job above; here macOS and
    # Windows must report isolation "reduced" and still log canaries, hosts
    # and blocked actions.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sandbox and parser
        run: cargo build --manifest-path native/Cargo.toml
      - name: Rust sandbox unit tests
        run: cargo test --manifest-path native/Cargo.toml --lib -- jail spawn
      - name: Python package
        run: pip install -e ".[dev]"
      - name: Sandbox tests
        run: pytest tests/test_sandbox.py -v
