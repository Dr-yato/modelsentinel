name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    # Full suite, including kernel isolation (seccomp + Landlock) assertions,
    # the dashboard build, and the CI policy gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rust parser and sandbox
        run: cargo test --manifest-path native/Cargo.toml
      - name: Python package
        run: pip install -e ".[dev,scanners]"
      - name: Unit and acceptance tests
        run: pytest
      - name: Landlock from a venv whose python links outside /usr and /opt
        # uv-managed CPython lives in ~/.local/share/uv/python; the venv is in
        # pytest's tmp dir. Neither is a default Landlock read root.
        run: |
          pip install uv
          uv python install 3.12
          BASE="$(uv python find --python-preference only-managed 3.12)"
          echo "base interpreter: $BASE -> $(readlink -f "$BASE")"
          case "$(readlink -f "$BASE")" in /usr/*|/opt/*) echo "base must be outside /usr and /opt"; exit 1;; esac
          MS_TEST_BASE_PYTHON="$BASE" pytest tests/test_sandbox.py -k symlinked_venv -v -rs
      - name: Dashboard (no make)
        run: python -m modelsentinel build-dashboard
      - name: sentinel doctor
        run: python -m modelsentinel doctor
      - name: CI policy blocks a malicious pickle and allows a clean template
        run: |
          python -c "from pathlib import Path; from modelsentinel.fixtureslib import write_fixtures; write_fixtures(Path('fixtures'))"
          if python -m modelsentinel scan fixtures/malicious/payload.bin --ci; then
            echo "malicious pickle was not blocked"
            exit 1
          fi
          python -m modelsentinel scan fixtures/gguf/clean_template.gguf --ci
      - name: Wheel builds with bundled Rust binaries
        run: |
          pip install build
          python -m build --wheel
          python -c "import glob, zipfile; names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert any(n.endswith('scripts/sentinel-parse') for n in names), names"

  cross-platform:
    # The same suite on macOS and Windows. There the sandbox must report
    # isolation "reduced" (WARN) and still log canaries, hosts and blocked actions.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Rust parser and sandbox
        run: cargo test --manifest-path native/Cargo.toml
      - name: Python package
        run: pip install -e ".[dev,scanners]"
      - name: Unit and acceptance tests
        run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dashboard (no make)
        run: python -m modelsentinel build-dashboard
      - name: sentinel doctor
        run: python -m modelsentinel doctor

  fuzz-smoke:
    # Short libFuzzer runs over the untrusted-file parsers. Nightly only, so it
    # cannot block a merge; failures upload the crashing input.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz each target for 60 s
        working-directory: native
        run: |
          for target in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run "$target" -- -max_total_time=60 -rss_limit_mb=2048 || exit 1
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: native/fuzz/artifacts
