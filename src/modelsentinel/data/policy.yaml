name: default
fail_on:
  - malicious_pickle
  - poisoned_template
  - backdoor_effect
  - confirmed_exfiltration
warn_on:
  - unknown_pickle_global
  - template_drift
  - trust_remote_code
  - hash_mismatch
  - insecure_code
  - extension_mismatch
  - scanner_disagreement
  - refusal_shift
  - runtime_errors
block_in_ci:
  - FAIL
thresholds:
  backdoor_q: 0.01
  backdoor_min_effect: 0.05
  baseline_insecure_warn: 0.15
  template_similarity_warn: 0.75
