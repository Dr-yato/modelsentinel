name: default
fail_on:
  - malicious_pickle
  - poisoned_template
  - backdoor_effect
  - confirmed_exfiltration
  - malicious_model_code
  - onnx_external_data_traversal
warn_on:
  - unknown_pickle_global
  - template_drift
  - trust_remote_code
  - hash_mismatch
  - insecure_code
  - extension_mismatch
  - scan_limit_exceeded
  - keras_lambda
  - keras_custom_object
  - onnx_custom_op
  - polyglot_file
  - scanner_disagreement
  - refusal_shift
  - runtime_errors
  - sandbox_outbound
  - sandbox_process_spawn
  - sandbox_isolation_reduced
  - reference_gap
block_in_ci:
  - FAIL
thresholds:
  backdoor_q: 0.01
  backdoor_min_effect: 0.05
  baseline_insecure_warn: 0.25
  reference_gap_warn: 0.10
  template_similarity_warn: 0.75
guard:
  # `sentinel guard` (runtime proxy). Each finding maps to an action:
  # block (replace the answer), warn (append a note), annotate (headers and a
  # `modelsentinel` JSON field only), pass. rule_actions win over severity_actions.
  # `--mode warn|annotate` caps the strongest action at run time.
  mode: block
  severity_actions:
    critical: block
    high: warn
    medium: annotate
    low: annotate
    info: annotate
  rule_actions:
    GUARD-EXFIL: block            # secret/env read + an outbound channel
    GUARD-DNS-EXFIL: block
    GUARD-ENCODED-PAYLOAD: block  # base64/hex literal that decodes to a URL or shell
    GUARD-PIPE-SHELL: block       # curl ... | sh
  # Hosts generated code may contact without a GUARD-OUTBOUND-HOST finding
  # (subdomains included). Loopback is always allowed.
  allow_hosts:
    - localhost
    - 127.0.0.1
    - "::1"
    - 0.0.0.0
    - example.com
    - example.org
    - example.net
    - pypi.org
    - files.pythonhosted.org
    - registry.npmjs.org
    - docs.python.org
  # Run Bandit/Semgrep (offline flags) on Python blocks when installed.
  external_tools: true
