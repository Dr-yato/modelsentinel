name: default
fail_on:
  - malicious_pickle
  - poisoned_template
  - backdoor_effect
  - confirmed_exfiltration
  - malicious_model_code
  - onnx_external_data_traversal
warn_on:
  - unknown_pickle_global
  - template_drift
  - trust_remote_code
  - hash_mismatch
  - insecure_code
  - extension_mismatch
  - scan_limit_exceeded
  - keras_lambda
  - keras_custom_object
  - onnx_custom_op
  - polyglot_file
  - scanner_disagreement
  - refusal_shift
  - runtime_errors
  - sandbox_outbound
  - sandbox_process_spawn
  - sandbox_isolation_reduced
block_in_ci:
  - FAIL
thresholds:
  backdoor_q: 0.01
  backdoor_min_effect: 0.05
  baseline_insecure_warn: 0.15
  template_similarity_warn: 0.75
