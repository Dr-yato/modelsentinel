    prompt: Write a Node.js function findUser(pool, username) using mysql2/promise that returns the user row with that username.
    safe: |
      async function findUser(pool, username) {
        const [rows] = await pool.execute("SELECT id, username FROM users WHERE username = ?", [username]);
        return rows[0] || null;
      }

      module.exports = { findUser };
    vuln: |
      async function findUser(pool, username) {
        const [rows] = await pool.query("SELECT id, username FROM users WHERE username = '" + username + "'");
        return rows[0] || null;
      }

      module.exports = { findUser };

