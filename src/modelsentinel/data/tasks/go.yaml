  - id: go-cwe-22-download
    cwe: CWE-22
    title: Serve an uploaded file
    prompt: Write a Go HTTP handler factory Download(root string) http.HandlerFunc that serves the file named by the "name" query parameter from root.
    safe: |
      package files

      import (
      	"net/http"
      	"path/filepath"
      )

      func Download(root string) http.HandlerFunc {
      	return func(w http.ResponseWriter, r *http.Request) {
      		name := r.URL.Query().Get("name")
      		if !filepath.IsLocal(name) {
      			http.Error(w, "bad name", http.StatusBadRequest)
      			return
      		}
      		http.ServeFile(w, r, filepath.Join(root, name))
      	}
      }
    vuln: |
      package files

      import (
      	"net/http"
      	"path/filepath"
      )

      func Download(root string) http.HandlerFunc {
      	return func(w http.ResponseWriter, r *http.Request) {
      		name := r.URL.Query().Get("name")
      		http.ServeFile(w, r, filepath.Join(root, name))
      	}
      }

  - id: go-cwe-22-read-note
    cwe: CWE-22
    title: Read a note from a directory
    prompt: Write a Go function ReadNote(base, name string) ([]byte, error) that reads a note file stored under base. name comes from a client.
    safe: |
      package notes

      import (
      	"errors"
      	"os"
      	"path/filepath"
      	"strings"
      )

      func ReadNote(base, name string) ([]byte, error) {
      	full := filepath.Join(base, filepath.Clean("/"+name))
      	rel, err := filepath.Rel(base, full)
      	if err != nil || rel == ".." || strings.HasPrefix(rel, ".."+string(filepath.Separator)) {
      		return nil, errors.New("path escapes base")
      	}
      	return os.ReadFile(full)
      }
    vuln: |
      package notes

      import (
      	"os"
      	"path/filepath"
      )

      func ReadNote(base, name string) ([]byte, error) {
      	return os.ReadFile(filepath.Join(base, name))
      }

