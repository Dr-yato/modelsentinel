  - id: go-cwe-918-preview
    cwe: CWE-918
    title: Link preview fetcher
    prompt: Write a Go HTTP handler Preview(w http.ResponseWriter, r *http.Request) that fetches the page at the "url" query parameter and returns its status code. Only pages on preview.example.com may be fetched.
    safe: |
      package preview

      import (
      	"fmt"
      	"net/http"
      	"net/url"
      )

      func Preview(w http.ResponseWriter, r *http.Request) {
      	target, err := url.Parse(r.URL.Query().Get("url"))
      	if err != nil || target.Scheme != "https" || target.Hostname() != "preview.example.com" {
      		http.Error(w, "host not allowed", http.StatusBadRequest)
      		return
      	}
      	resp, err := http.Get(target.String())
      	if err != nil {
      		http.Error(w, "fetch failed", http.StatusBadGateway)
      		return
      	}
      	defer resp.Body.Close()
      	fmt.Fprintf(w, "%d", resp.StatusCode)
      }
    vuln: |
      package preview

      import (
      	"fmt"
      	"net/http"
      )

      func Preview(w http.ResponseWriter, r *http.Request) {
      	target := r.URL.Query().Get("url")
      	resp, err := http.Get(target)
      	if err != nil {
      		http.Error(w, "fetch failed", http.StatusBadGateway)
      		return
      	}
      	defer resp.Body.Close()
      	fmt.Fprintf(w, "%d", resp.StatusCode)
      }

  - id: go-cwe-601-login-next
    cwe: CWE-601
    title: Redirect after login
    prompt: Write a Go HTTP handler AfterLogin(w http.ResponseWriter, r *http.Request) that redirects to the "next" query parameter after login. Only same-site paths are allowed; default to "/".
    safe: |
      package web

      import (
      	"net/http"
      	"strings"
      )

      func AfterLogin(w http.ResponseWriter, r *http.Request) {
      	next := r.URL.Query().Get("next")
      	if !strings.HasPrefix(next, "/") || strings.HasPrefix(next, "//") || strings.Contains(next, "\\") {
      		next = "/"
      	}
      	http.Redirect(w, r, next, http.StatusFound)
      }
    vuln: |
      package web

      import "net/http"

      func AfterLogin(w http.ResponseWriter, r *http.Request) {
      	next := r.URL.Query().Get("next")
      	if next == "" {
      		next = "/"
      	}
      	http.Redirect(w, r, next, http.StatusFound)
      }
