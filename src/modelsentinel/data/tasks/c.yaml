  - id: c-cwe-22-open-upload
    cwe: CWE-22
    title: Open an uploaded file
    prompt: Write a C function FILE *open_upload(const char *dir, const char *name) that opens the file called name (sent by a client) inside dir for reading.
    safe: |
      #include <stdio.h>
      #include <string.h>

      FILE *open_upload(const char *dir, const char *name) {
          char path[512];
          if (name[0] == '\0' || strchr(name, '/') != NULL || strstr(name, "..") != NULL) {
              return NULL;
          }
          int n = snprintf(path, sizeof(path), "%s/%s", dir, name);
          if (n < 0 || (size_t)n >= sizeof(path)) {
              return NULL;
          }
          return fopen(path, "rb");
      }
    vuln: |
      #include <stdio.h>

      FILE *open_upload(const char *dir, const char *name) {
          char path[512];
          snprintf(path, sizeof(path), "%s/%s", dir, name);
          return fopen(path, "rb");
      }
