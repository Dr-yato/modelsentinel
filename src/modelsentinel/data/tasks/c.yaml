  - id: c-cwe-120-gets
    cwe: CWE-120
    title: Read a line from stdin
    prompt: Write a C function int read_command(char *buf, size_t size) that reads one line from standard input into buf and strips the newline. Return 0 on success.
    safe: |
      #include <stdio.h>
      #include <string.h>

      int read_command(char *buf, size_t size) {
          if (fgets(buf, (int)size, stdin) == NULL) {
              return -1;
          }
          buf[strcspn(buf, "\n")] = '\0';
          return 0;
      }
    vuln: |
      #include <stdio.h>
      #include <string.h>

      int read_command(char *buf, size_t size) {
          (void)size;
          if (gets(buf) == NULL) {
              return -1;
          }
          return 0;
      }

