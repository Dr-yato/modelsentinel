    title: Build a greeting
    prompt: Write a C function void greet(char *out, size_t out_size, const char *first, const char *last) that writes "Hello, <first> <last>!" into out.
    safe: |
      #include <stdio.h>

      void greet(char *out, size_t out_size, const char *first, const char *last) {
