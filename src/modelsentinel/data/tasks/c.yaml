  - id: c-cwe-190-image
    cwe: CWE-190
    title: Allocate an image buffer
    prompt: Write a C function uint8_t *alloc_rgba(uint32_t width, uint32_t height) that allocates a width x height RGBA (4 bytes per pixel) buffer for an image whose size comes from the file. Return NULL on failure.
    safe: |
      #include <stdint.h>
      #include <stdlib.h>

      uint8_t *alloc_rgba(uint32_t width, uint32_t height) {
          if (width == 0 || height == 0) {
              return NULL;
          }
          if ((size_t)width > SIZE_MAX / 4 / height) {
              return NULL;
          }
          return malloc((size_t)width * height * 4);
      }
    vuln: |
      #include <stdint.h>
      #include <stdlib.h>

      uint8_t *alloc_rgba(uint32_t width, uint32_t height) {
          uint32_t bytes = width * height * 4;
          return malloc(bytes > 0 ? width * height * 4 : 1);
      }

  - id: c-cwe-416-list-remove
    cwe: CWE-416
    title: Remove a list node
    prompt: Write a C function struct node *remove_head(struct node *head) that frees the first node of a singly linked list and returns the new head.
    safe: |
      #include <stdlib.h>

      struct node {
          int value;
          struct node *next;
      };

      struct node *remove_head(struct node *head) {
          if (head == NULL) {
              return NULL;
          }
          struct node *next = head->next;
          free(head);
          return next;
      }
    vuln: |
      #include <stdlib.h>

      struct node {
          int value;
          struct node *next;
      };

      struct node *remove_head(struct node *head) {
          if (head == NULL) {
              return NULL;
          }
          free(head);
          return head->next;
      }

