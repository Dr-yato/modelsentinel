[project]
name = "modelsentinel"
version = "0.3.0"
description = "Offline supply-chain checks for open-weight coding models"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "ModelSentinel" }]
dependencies = [
  "fastapi>=0.115",
  "jinja2>=3.1",
  "pyyaml>=6",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "packaging>=23"]
# Weight analysis (sentinel weight-diff). numpy is required by it; gguf adds
# dequantization for the GGUF types ModelSentinel does not decode itself.
# Keep one requirement per line so other features can extend this extra.
# Heavy, optional analyses. weight-diff needs numpy (gguf adds rarer quant
# types); `sentinel probe` needs torch + transformers. CPU-only torch is
# enough: pip install torch --index-url https://download.pytorch.org/whl/cpu
advanced = [
  "numpy>=1.26",
  "gguf>=0.10",
  "torch>=2.2",
  "transformers>=4.45",
  "safetensors>=0.4",
  "accelerate>=0.26",  # transformers needs it to load GGUF files
]
# Optional second opinions. All are used only when importable / on PATH, and
# `sentinel doctor` reports which ones are active.
#  - modelscan has no Python 3.13+ wheels yet, so it is skipped there; fickling
#    still gives the second pickle opinion.
#  - semgrep has no native Windows build; Bandit covers Python there.
scanners = [
  "modelscan>=0.7; python_version < '3.13'",
  "fickling>=0.1.3",
  "bandit>=1.7.9",
  "semgrep>=1.80; platform_system != 'Windows'",
]

[project.scripts]
sentinel = "modelsentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
modelsentinel = ["data/**/*", "web/**/*", "bin/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68", "setuptools-rust>=1.9"]
build-backend = "setuptools.build_meta"

# `pip install .` compiles the untrusted-file parser and the sandbox runner and
# installs them next to the `sentinel` script (they are found on PATH). Without
# a Rust toolchain the install still succeeds (optional = true); run
# `make native` afterwards, or set SENTINEL_SENTINEL_PARSE_BIN.
[[tool.setuptools-rust.bins]]
target = "sentinel-parse"
path = "native/Cargo.toml"
optional = true

[[tool.setuptools-rust.bins]]
target = "sentinel-sandbox"
path = "native/Cargo.toml"
optional = true
