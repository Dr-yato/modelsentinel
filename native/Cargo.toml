[package]
name = "sentinel-native"
version = "0.1.0"
edition = "2021"
description = "Untrusted-file parser and sandbox runner for ModelSentinel"
license = "Apache-2.0"

[[bin]]
name = "sentinel-parse"
path = "src/bin/parse.rs"

[[bin]]
name = "sentinel-sandbox"
path = "src/bin/sandbox.rs"

[dependencies]
flate2 = "1.0"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = false
codegen-units = 1
